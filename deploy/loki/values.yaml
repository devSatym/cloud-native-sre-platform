# Values for grafana/loki-stack (pinned by scripts/deploy-observability.sh).
# This is a small single-cluster log stack, not a multi-tenant production design.
loki:
  enabled: true
  isDefault: false
  persistence:
    enabled: true
    # Empty selects the GKE cluster default StorageClass.
    storageClassName: ""
    size: 10Gi
  config:
    table_manager:
      retention_deletes_enabled: true
      retention_period: 720h
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 720h
      max_entries_limit_per_query: 5000
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32

promtail:
  enabled: true
  config:
    logLevel: info
    serverPort: 3101
    clients:
      - url: http://{{ .Release.Name }}:3100/loki/api/v1/push

# Grafana is supplied by kube-prometheus-stack; its Loki datasource is in
# deploy/prometheus/values.yaml.
grafana:
  enabled: false
prometheus:
  enabled: false
fluent-bit:
  enabled: false
filebeat:
  enabled: false
logstash:
  enabled: false
