# Safe local-development override. Build these images locally before use:
# docker build -t cloud-native-sre-platform-api:dev -f services/api/Dockerfile .
# docker build -t cloud-native-sre-platform-payments:dev -f services/payments/Dockerfile .
api:
  image:
    repository: cloud-native-sre-platform-api
    tag: dev
    pullPolicy: IfNotPresent
  env:
    - name: LOG_LEVEL
      value: DEBUG

payments:
  image:
    repository: cloud-native-sre-platform-payments
    tag: dev
    pullPolicy: IfNotPresent

ingress:
  enabled: false

networkPolicy:
  enabled: false

monitoring:
  enabled: false
  prometheusRule:
    enabled: false
