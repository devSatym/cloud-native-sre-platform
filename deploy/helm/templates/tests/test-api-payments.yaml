{{- if .Values.envoy.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-api-flow-test"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-native-sre-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-test
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: test
      image: curlimages/curl:8.10.1
      command:
        - /bin/sh
        - -ec
        - |
          curl --fail --silent --show-error http://{{ .Release.Name }}-envoy/healthz
          curl --fail --silent --show-error \
            --request POST http://{{ .Release.Name }}-envoy/api/pay \
            --header 'Content-Type: application/json' \
            --header 'X-Tenant: helm-test' \
            --data '{"amount":10,"currency":"USD","tenant_id":"helm-test"}'
{{- end }}
