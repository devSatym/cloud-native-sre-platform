{{- if and .Values.ingress.enabled .Values.envoy.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-native-sre-platform.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{ if .Values.ingress.host }}host: {{ .Values.ingress.host | quote }}{{ end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-envoy
                port:
                  name: http
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-envoy
                port:
                  name: http
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-envoy
                port:
                  name: http
{{- end }}
