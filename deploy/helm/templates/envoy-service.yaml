{{- if .Values.envoy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-envoy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-native-sre-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: envoy
spec:
  type: {{ .Values.envoy.service.type }}
  selector:
    app.kubernetes.io/name: envoy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.envoy.service.port }}
      targetPort: http
      protocol: TCP
    - name: admin
      port: {{ .Values.envoy.service.adminPort }}
      targetPort: admin
      protocol: TCP
{{- end }}
