name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install lint dependencies
        run: python -m pip install --upgrade pip ruff==0.1.6

      - name: Lint Python source and tests
        run: ruff check services tests

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v -m "not integration" --cov=services --cov-report=term

  compose-integration:
    name: Compose API flow
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install integration test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Start Compose services
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Verify the API-to-Payments flow
        run: |
          curl --fail --show-error --retry 10 --retry-connrefused --retry-delay 2 \
            --header 'Content-Type: application/json' \
            --header 'X-Tenant: ci' \
            --data '{"amount": 100, "currency": "USD", "tenant_id": "ci"}' \
            http://localhost:8000/pay > payment-response.json
          python - <<'PY'
          import json

          with open("payment-response.json", encoding="utf-8") as response_file:
              response = json.load(response_file)

          assert response["status"] == "completed"
          assert response["amount"] == 100
          assert response["currency"] == "USD"
          assert response["payment_id"]
          PY

      - name: Run Compose integration tests
        run: python -m pytest -v -m integration

      - name: Collect Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans

  helm-validate:
    name: Helm render and schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Build local chart dependencies
        run: helm dependency build deploy/helm

      - name: Lint chart
        run: helm lint deploy/helm --strict

      - name: Render chart
        run: >-
          helm template cloud-native-sre deploy/helm
          --namespace cloud-native-sre
          > rendered-manifests.yaml

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.6.7
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output kubeconform.tar.gz
          tar --extract --gzip --file kubeconform.tar.gz kubeconform
          install --mode 0755 kubeconform "$HOME/.local/bin/kubeconform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate rendered Kubernetes manifests
        run: kubeconform -strict -summary -ignore-missing-schemas rendered-manifests.yaml

  trivy-filesystem:
    name: Trivy filesystem gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fail on high or critical filesystem vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
